name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -m "not integration"

  deploy:
    name: Deploy to ConoHa VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + rebuild)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_DEVEX_API_PATH }}"
            git pull origin main
            # マイグレーションを、新しいコードの起動より前に流す(Phase 24)。新しいイメージを
            # 作り、使い捨てのコンテナでマイグレーションしてから入れ替える。マイグレーションが
            # 失敗すると set -e でここで止まり、古いコードのコンテナが古いスキーマのまま動き続ける
            # (以前の「起動 → マイグレーション」の順では、失敗すると新しいコードが古いスキーマで動いた)。
            docker compose -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.prod.yml run --rm -T backend uv run alembic upgrade head
            docker compose -f docker-compose.prod.yml up -d
