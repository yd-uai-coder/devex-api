services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # postgres-init/のスクリプトが読む。統合テスト専用DBの名前(docker-compose.test.yml参照)。
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-app_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ボリューム初回初期化時のみ実行される(既存ボリュームには遡って適用されない)。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      target: builder
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    command:
      [
        "uv", "run", "uvicorn", "app.main:app",
        "--host", "0.0.0.0", "--port", "8000", "--reload",
      ]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  backend_venv:

networks:
  internal:
